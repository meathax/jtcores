params:
  - { name: RAM_OFFSET,   value: "22'h120000" }
  - { name: PCM_OFFSET,   value: "22'h040000>>1" }
clocks:
  clk48:
    - freq: 16M
      outputs:
        - cen_16
        - cen_8
        - cen_4   # cen_fm
        - cen_2   # cen_fm2
    - freq: 18432k
      gate: [pcm]
      outputs:
        - cen_pcm
audio:
  gain: 1.99
  # FM and PCM share the K054321 volume register, rsum/rc values are not measured
  channels:
    - { name: fm,     module: jt51,     rsum: 1k, rc: [ { r: rout, c: 2.2n } ] }
    - { name: k539,   module: jt054539, rsum: 1k, rc: [ { r: 4.7k, c: 2.2n } ] }
sdram:
  banks:
    - buses:
        - name: ram
          addr_width: 16
          data_width: 16
          offset: RAM_OFFSET
          rw: true
        - name: main
          addr_width: 21
          data_width: 16
          cache_size: 32kB
    - buses:
        - name: snd
          addr_width: 18
          data_width: 8
        - name: pcm
          # Bucky O'Hare populates a second 2 MB ROM
          addr_width: 22
          data_width: 8
          offset: PCM_OFFSET
    - buses:
        - name: lyrf
          addr_width: 21
          data_width: 32
        - name: lyra
          addr_width: 21
          data_width: 32
        - name: lyrb
          addr_width: 21
          data_width: 32
        - name: lyrc
          addr_width: 21
          data_width: 32
    - buses:
        - name: lyro
          addr_width: 23
          data_width: 32
bram:
  # EEROM
  - name: nvram
    addr_width: 7
    data_width: 8
    simfile: {}
    rw: true
    ioctl: { save: true, restore: true, order: 0 }
