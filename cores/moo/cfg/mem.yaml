params:
  - { name: RAM_OFFSET,   value: "22'h120000" }
  - { name: PCM_OFFSET,   value: "22'h040000>>1" }
clocks:
  clk48:
    - freq: 16M
      outputs:
        - cen_16
        - cen_8
        - cen_4   # cen_fm
        - cen_2   # cen_fm2
    - freq: 18432k
      gate: [pcm]
      outputs:
        - cen_pcm
audio:
  gain: 1.99
  # C5 (port): the real board sums the YM2151's serial output into the
  # K054539's AUX pin internally (one physical output path, sound.kicad_sch
  # chip E4) -- there is no real separate per-chip filter network to draw
  # rsum/rc values from. `fm` is split out here only because the ported
  # jt054539 module (from a hardware-validated third-party core, see
  # jt054539.v's header) has no AUX input; rsum/rc for `fm` are a generic,
  # unmeasured choice (jt51's own declared `rout`, matching the `k539`
  # channel's rsum for balance since both channels' vpp is already handled
  # by audio_mod.yaml), not derived from this board. Evidence class:
  # HYPOTHESIS. See jtmoo_sound.v's jt054539 instantiation comment.
  # C6b: `fm` and `k539` still mix here, downstream, as two separate rcmix
  # channels (unchanged by C6b) -- but both are now attenuated by the SAME
  # K054321 volume register before reaching this stage (jt054321.v
  # snd_l/snd_r and snd2_l/snd2_r, both driven by one `gain`). Only the
  # *volume law* gap is fixed by C6b; the rsum/rc HYPOTHESIS above is
  # unrelated and unchanged.
  channels:
    - { name: fm,     module: jt51,     rsum: 1k, rc: [ { r: rout, c: 2.2n } ] }
    - { name: k539,   module: jt054539, rsum: 1k, rc: [ { r: 4.7k, c: 2.2n } ] }
sdram:
  banks:
    - buses:
        - name: ram
          addr_width: 16
          data_width: 16
          offset: RAM_OFFSET
          rw: true
        - name: main
          addr_width: 21
          data_width: 16
          cache_size: 32kB
    - buses:
        - name: snd
          addr_width: 18
          data_width: 8
        - name: pcm
          # 22 bits (4 MB): Moo Mesa only populates B6 (2 MB, 151a08.b6) but
          # Bucky O'Hare also populates A6, selected by the K054539's ROBS
          # output (E4 pin 111, N.C. on Moo Mesa). C8.
          addr_width: 22
          data_width: 8
          offset: PCM_OFFSET
    - buses:
        - name: lyrf
          addr_width: 21
          data_width: 32
        - name: lyra
          addr_width: 21
          data_width: 32
        - name: lyrb
          addr_width: 21
          data_width: 32
        - name: lyrc
          addr_width: 21
          data_width: 32
    - buses:
        - name: lyro
          addr_width: 23
          data_width: 32
bram:
  # EEROM
  - name: nvram
    addr_width: 7
    data_width: 8
    simfile: {}

    rw: true
    ioctl: { save: true, restore: true, order: 0 }
